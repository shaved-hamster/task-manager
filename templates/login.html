{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="form-card">
    <p class="eyebrow">Раді вас бачити</p><h1>Вхід</h1>
    <form method="POST">
        <label>Електронна пошта</label>
        <input type="email" name="email" required placeholder="name@example.com">
        <label>Пароль</label>
        <input type="password" name="password" required>
        <button class="button" type="submit">Увійти</button>
    </form>
    <p class="muted">Ще не зареєстровані? <a href="{{ url_for('register') }}">Створити акаунт</a></p>
</div>
{% endblock %}
